<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>

<script>

	dataLayer.push(arguments);

<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ tr(title) }}</title>
<meta name="description" content="{{ tr(description) }}">
<meta name="keywords" content="{{ tr(tags) }}">
<link href="/static/default.css" rel="stylesheet" type="text/css" media="all" />
<link rel="icon" href="/static/ico/favicon.ico" type="image/x-icon">
</head>
<body>
<div id="header-wrapper">
	<div id="header" class="container">
		<div id="logo">
			<a href="/{{lang}}/">
				<!--TODO: optimization, more little logo.png-->
				<img src="/static/images/logo_big.png"/>
			</a>
		</div>
		<div id="menu">
			<ul>
				<a href="{{ ru_link }}" title="" class="header-lang-link">
					<img src="/static/ico/ru.svg" class="header-lang-icon" alt="Rus"/>
				</a>
				<a href="{{ en_link }}" title="" class="header-lang-link">
					<img src="/static/ico/gb.svg" class="header-lang-icon" alt="Eng"/>
				</a>
			</ul>
		</div>
	</div>
</div>
<div id="page-wrapper">
	<div id="page" class="container">

        {% block content %}
        {% endblock %}

    </div>
</div>
<div id="footer-wrapper">
	<div id="footer" class="container">
		<div class="footer-block" id="footer-first-block">
			<a class="footer-link" href="https://physlab.ru/contacts">
				<svg class="footer-icon" xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="32"><path fill="#fff" d="M480-480q33 0 56.5-23.5T560-560q0-33-23.5-56.5T480-640q-33 0-56.5 23.5T400-560q0 33 23.5 56.5T480-480Zm0 294q122-112 181-203.5T720-552q0-109-69.5-178.5T480-800q-101 0-170.5 69.5T240-552q0 71 59 162.5T480-186Zm0 106Q319-217 239.5-334.5T160-552q0-150 96.5-239T480-880q127 0 223.5 89T800-552q0 100-79.5 217.5T480-80Zm0-480Z"/></svg>
				<span class="footer-multiline">{{ tr(address) | safe }}</span>
			</a>
		</div>
		<div class="footer-block">
			<a class="footer-link" href="tel:+7(499)343-56-24">
				<svg class="footer-icon" xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="32"><path fill="#fff" d="M798-120q-125 0-247-54.5T329-329Q229-429 174.5-551T120-798q0-18 12-30t30-12h162q14 0 25 9.5t13 22.5l26 140q2 16-1 27t-11 19l-97 98q20 37 47.5 71.5T387-386q31 31 65 57.5t72 48.5l94-94q9-9 23.5-13.5T670-390l138 28q14 4 23 14.5t9 23.5v162q0 18-12 30t-30 12ZM241-600l66-66-17-94h-89q5 41 14 81t26 79Zm358 358q39 17 79.5 27t81.5 13v-88l-94-19-67 67ZM241-600Zm358 358Z"/></svg>
				<span>+7(499)343-56-24</span>
			</a>
		</div>
		<div class="footer-block" id="footer-last-block">
			<a class="footer-link" href="mailto:info@physlab.ru">
				<svg class="footer-icon" xmlns="http://www.w3.org/2000/svg" height="32" viewBox="0 -960 960 960" width="32"><path fill="#fff" d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280L160-640v400h640v-400L480-440Zm0-80 320-200H160l320 200ZM160-640v-80 480-400Z"/></svg>
				<span>info@physlab.ru</span>
			</a>
		</div>
	</div>
	<div id="footer-epc-block">
		<a class="footer-link" href="https://physlab.ru/">
			{{tr(epc)}}
			<br>
			<span>physlab.ru</span>
		</a>
	</div>
</div>
</body>
</html>
